:root{
  
  --paper:#f4f5f7;          
  --paper-deep:#eef0f1;     
  --canyon:#e9eaec;         
  --ink:#0E1117;            
  --dim:#5E5A54;            
  --faint:#63666B;          
  --marigold:#346961;       
  --marigold-soft:#24504a;  
  --terracotta:#B84A3C;     
  --ocotillo:#2D7A6E;       
  --turquoise:#9C5540;      
  --hair:rgba(14,17,23,.12);
  --hair-soft:rgba(14,17,23,.06);
  --seg-bar:#cfd2d4;      
  color-scheme:light;

  --headline:'EB Garamond',Georgia,'Times New Roman',serif;
  --sans:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:'Space Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --serif:'EB Garamond',Georgia,'Times New Roman',serif;

  --wrap:1600px;
  --step:clamp(14px,2.2vw,26px);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
a{color:var(--marigold); text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
:focus-visible{outline:2px solid var(--marigold); outline-offset:2px; border-radius:0}


h1,h2,h3{font-family:var(--headline); font-weight:400; margin:0; text-transform:none}
h1{font-size:clamp(30px,4.6vw,50px); letter-spacing:-.025em; line-height:1.06; text-wrap:balance}
h2{font-size:clamp(21px,2.6vw,29px); letter-spacing:-.02em; line-height:1.2}
h3{font-size:18px; letter-spacing:-.012em}
.lead{font-family:var(--serif); font-style:italic; font-size:clamp(18px,1.6vw,22px);
      line-height:1.5; color:var(--dim); max-width:62ch; margin:0; text-wrap:balance}
.label,.eyebrow{font-family:var(--mono); text-transform:uppercase; letter-spacing:.2em;
      font-size:11px; color:var(--faint); font-weight:500}
.eyebrow{letter-spacing:.22em}
.note{font-size:13.5px; color:var(--faint); line-height:1.5}
.num{font-family:var(--headline); font-weight:400; font-variant-numeric:tabular-nums;
     letter-spacing:-.01em}


.wrap{max-width:var(--wrap); margin:0 auto; padding:0 var(--step)}
.app{min-height:100vh; display:flex; flex-direction:column}

.topbar{border-bottom:1px solid var(--hair); background:var(--paper-deep);
        position:sticky; top:0; z-index:40}
.topbar .wrap{display:flex; align-items:center; gap:20px; height:56px}
.brand{display:flex; align-items:baseline; gap:11px; min-width:0}
.wordmark{font-family:var(--headline); font-weight:200; font-size:20px;
          letter-spacing:.3em; text-transform:uppercase; padding-right:2px}

.brand-desc{font-family:var(--mono); font-size:11px; letter-spacing:.2em;
            text-transform:uppercase; color:var(--faint); white-space:nowrap}
@media (max-width:820px){ .brand-kind{display:none} }
@media (max-width:560px){ .brand-desc{display:none} }
.topbar .spacer{flex:1}
.topbar .by{font-family:var(--mono); font-size:11px; letter-spacing:.2em;
            text-transform:uppercase; color:var(--faint); white-space:nowrap}

@media (max-width:900px){ .topbar .by{display:none} }


.rail{display:flex; align-items:center; gap:0; overflow-x:auto; scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail button{display:flex; align-items:center; gap:8px; padding:6px 13px;
  font-family:var(--mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--faint); border-bottom:1px solid transparent; white-space:nowrap;
  transition:color .16s}
.rail button:hover{color:var(--dim)}
.rail button .n{font-variant-numeric:tabular-nums; opacity:.55}
.rail button[aria-current="true"]{color:var(--marigold); border-bottom-color:var(--marigold)}
.rail button[disabled]{opacity:.35; cursor:not-allowed}


.navtoggle{display:none; align-items:center; justify-content:center;
  width:38px; height:38px; flex:none; margin-left:2px;
  border:1px solid var(--hair); background:var(--paper); color:var(--dim);
  transition:border-color .16s,color .16s}
.navtoggle:hover{border-color:var(--dim); color:var(--ink)}
.navtoggle[aria-expanded="true"]{border-color:var(--marigold); color:var(--marigold)}


@media (max-width:840px){
  .rail, .psel{display:none}
  .navtoggle{display:inline-flex}
}

main{flex:1; padding:calc(var(--step)*1.6) 0 28px}
.screen{display:none}
.screen.on{display:block; animation:rise .32s cubic-bezier(.22,.61,.36,1)}
@keyframes rise{from{opacity:0; transform:translateY(7px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){
  .screen.on{animation:none}
  *{transition-duration:.01ms !important; animation-duration:.01ms !important}
}

.screen-head{display:grid; grid-template-columns:minmax(0,1fr) auto;
             grid-template-areas:"eb eb" "h1 ask" "lead tools";
             column-gap:clamp(20px,3vw,40px); row-gap:9px; align-items:end;
             margin-top:calc(var(--step)*.9); margin-bottom:calc(var(--step)*1.2)}
.screen-head .sh-eb{grid-area:eb}
.screen-head h1{grid-area:h1; align-self:center; min-width:0}
.screen-head .sh-ask{grid-area:ask; align-self:center; justify-self:end;
                     width:clamp(230px,26vw,330px)}
.screen-head .lead{grid-area:lead; margin-top:2px}
.screen-head .sh-tools{grid-area:tools; justify-self:end; display:flex; align-items:center;
                       gap:10px; margin-bottom:1px}
.sh-tools .tag{align-self:center}
.sh-tools .btn{padding:7px 14px; font-size:10.5px}
@media (max-width:720px){
  .screen-head{grid-template-columns:minmax(0,1fr); grid-template-areas:"ask" "eb" "h1" "lead" "tools"}
  .screen-head .sh-ask{width:100%; justify-self:stretch; margin-bottom:10px}
  .screen-head .sh-tools{justify-self:start; flex-wrap:wrap}
}


.panel{border:1px solid var(--hair); background:var(--canyon); padding:18px 20px 20px;
       display:flex; flex-direction:column; gap:14px; min-width:0}
.panel > header{display:flex; align-items:baseline; justify-content:space-between; gap:12px}
.panel > header h3{color:var(--dim)}
.grid{display:grid; gap:14px; margin-bottom:14px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.62fr) minmax(0,1fr)}
.g31{grid-template-columns:minmax(0,3fr) minmax(0,1fr)}
@media (max-width:900px){.g3,.g2,.g21,.g31{grid-template-columns:1fr}}


.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr));
      border:1px solid var(--hair); background:var(--canyon); margin-bottom:14px}
.kpi{padding:15px 18px 16px; border-right:1px solid var(--hair-soft);
     display:flex; flex-direction:column; gap:5px; min-width:0}
.kpi:last-child{border-right:0}
.kpi .v{font-family:var(--headline); font-weight:200; font-size:clamp(23px,2.7vw,31px);
        line-height:1.05; font-variant-numeric:tabular-nums; letter-spacing:-.012em}
.kpi .k{font-family:var(--mono); font-size:11px; letter-spacing:.16em;
        text-transform:uppercase; color:var(--dim); line-height:1.4; text-wrap:balance}
.kpi .n{font-family:var(--mono); font-size:10.5px; letter-spacing:.13em;
        text-transform:uppercase; color:var(--faint)}
@media (max-width:640px){
  .kpi,button.kpi{border-right:0; border-bottom:1px solid var(--hair-soft)}
}

button.kpi{font:inherit; color:inherit; background:none; border:0;
  border-right:1px solid var(--hair-soft); text-align:left; width:100%;
  cursor:pointer; transition:background .16s}
button.kpi:last-child{border-right:0}
button.kpi:hover{background:rgba(14,17,23,.04)}

.kpi.group-start{box-shadow:inset 1px 0 0 var(--hair)}
@media (max-width:640px){ .kpi.group-start{box-shadow:none} }

.kpi.accent .v{color:var(--marigold)}
.kpi{position:relative}
.drill-hint{position:absolute; right:12px; top:13px; display:flex; align-items:center;
  gap:4px; font-family:var(--mono); font-size:10px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--faint); opacity:0; transition:opacity .16s}
button.kpi:hover .drill-hint,button.kpi:focus-visible .drill-hint{opacity:1}
@media (prefers-reduced-motion:reduce){ .drill-hint{transition:none} }

.modal{position:fixed; inset:0; z-index:60; display:flex; align-items:center;
       justify-content:center; padding:24px}
.modal[hidden]{display:none}
.modal-scrim{position:absolute; inset:0; background:rgba(7,9,12,.74)}
.modal-panel{position:relative; z-index:1; display:flex; flex-direction:column;
  width:min(880px,100%); max-height:80vh; background:var(--canyon);
  border:1px solid var(--hair)}
.modal-head{display:flex; align-items:flex-start; gap:16px; padding:18px 20px 15px;
  border-bottom:1px solid var(--hair)}

.whatif-in{display:flex; flex-direction:column; gap:9px; min-width:0; cursor:pointer}
.whatif-in .label{display:flex; align-items:center; gap:7px; flex-wrap:wrap; line-height:1.4}
.whatif-in .val{font-family:var(--headline); font-weight:200; font-size:21px;
                font-variant-numeric:tabular-nums; color:var(--ink)}
.whatif-out{display:flex; flex-direction:column; gap:6px; min-width:0;
            border-left:1px solid var(--hair); padding-left:18px}
.whatif-out .v{font-size:clamp(23px,2.7vw,31px); line-height:1.05; color:var(--ink)}
.whatif-out .n{font-family:var(--mono); font-size:10.5px; letter-spacing:.13em;
               text-transform:uppercase; color:var(--faint)}
@media (max-width:720px){
  .whatif{grid-template-columns:1fr}
  .whatif-out{border-left:0; border-top:1px solid var(--hair); padding:14px 0 0}
}


.assumption{font-family:var(--mono); font-size:10.5px; letter-spacing:.17em;
  text-transform:uppercase; color:var(--marigold-soft); border:1px solid var(--hair);
  padding:2px 6px; white-space:nowrap}


input[type="range"]{-webkit-appearance:none; appearance:none; width:100%; height:12px;
  margin:0; background:transparent; cursor:pointer}
input[type="range"]::-webkit-slider-runnable-track{height:2px; background:var(--hair);
  border:0; border-radius:0}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none; appearance:none;
  width:12px; height:12px; margin-top:-5px; background:var(--marigold);
  border:0; border-radius:0}
input[type="range"]::-moz-range-track{height:2px; background:var(--hair);
  border:0; border-radius:0}
input[type="range"]::-moz-range-thumb{width:12px; height:12px; background:var(--marigold);
  border:0; border-radius:0}


.ask{position:relative}
.ask-field{display:flex; align-items:center; gap:9px; height:40px; padding:0 12px;
  background:var(--paper); border:1px solid var(--hair); color:var(--faint);
  transition:border-color .16s; cursor:text}
.ask-field:hover{border-color:var(--dim)}
.ask-field:focus-within{border-color:var(--marigold); color:var(--marigold)}
.ask-in{flex:1; min-width:0; border:0; outline:0; background:transparent; padding:0;
  font-family:var(--sans); font-size:15px; color:var(--ink)}
.ask-in::placeholder{color:var(--faint)}
.ask-list{position:absolute; right:0; top:calc(100% + 4px); z-index:45;
  width:max(100%, 400px); max-height:min(430px,62vh); overflow-y:auto;
  background:var(--paper); border:1px solid var(--hair); padding:6px 0}
.ask-list[hidden]{display:none}
.ask-h,.ask-none{font-family:var(--mono); font-size:10px; letter-spacing:.17em; text-transform:uppercase;
  color:var(--faint); padding:9px 14px 5px}
.ask-none{text-transform:none; letter-spacing:.02em; font-family:var(--sans); font-size:13.5px; color:var(--dim)}
.ask-opt{display:grid; grid-template-columns:76px minmax(0,1fr) auto; align-items:baseline; gap:10px;
  width:100%; padding:9px 14px; text-align:left; border-left:2px solid transparent}
.ask-opt:hover,.ask-opt.on{background:var(--canyon); border-left-color:var(--marigold)}

.ask-list.grouped .ask-opt{grid-template-columns:minmax(0,1fr) auto}
.ask-list.grouped .ask-kind{display:none}
.ask-kind{font-family:var(--mono); font-size:9.5px; letter-spacing:.15em; text-transform:uppercase; color:var(--faint)}
.ask-q{font-size:14.5px; line-height:1.35; color:var(--ink)}
.ask-pv{font-family:var(--mono); font-size:11px; letter-spacing:.06em; color:var(--marigold);
  white-space:nowrap; font-variant-numeric:tabular-nums}
@media (max-width:720px){
  .ask-in{font-size:16px}
  .ask-list{left:0; right:0; width:auto}
  .ask-opt{grid-template-columns:minmax(0,1fr) auto; row-gap:2px}
  .ask-kind{grid-column:1 / -1}
}

.ask-panel{width:min(760px,100%)}
.ask-kpis{margin-bottom:0}
.ask-text{margin:0; font-size:16px; line-height:1.6; color:var(--ink); max-width:66ch; text-wrap:pretty}
.ask-src{display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px}
.ask-src .tag{align-self:center}

.panel,.kpis,.livestrip,.actions,.def{scroll-margin-top:84px}
.ask-hit{animation:askhit 2.2s ease-out}
@keyframes askhit{0%,55%{outline:2px solid var(--marigold); outline-offset:3px}
  100%{outline:2px solid transparent; outline-offset:3px}}


.readout-item{display:flex; flex-direction:column; gap:5px; padding:12px 0;
              border-bottom:1px solid var(--hair-soft)}
.readout-item:last-child{border-bottom:0}
.readout-item p{margin:0; max-width:74ch}

.brand{align-items:center}
.brand-svg{display:block; height:32px; width:auto; flex:none}
@media (max-width:640px){
  .brand{width:41px; overflow:hidden}
  .brand-svg{height:17px}
}


.livestrip{display:flex; align-items:center; gap:22px; flex-wrap:wrap;
  border:1px solid var(--hair); border-left:2px solid var(--marigold);
  background:var(--canyon); padding:16px 20px; margin:0 0 var(--step)}
.live-mark{display:inline-flex; align-items:center; gap:9px; flex-shrink:0;
  font-family:var(--mono); font-size:11px; letter-spacing:.17em;
  text-transform:uppercase; color:var(--marigold)}
.live-mark i{width:7px; height:7px; border-radius:50%; background:var(--marigold); flex-shrink:0}
.live-body{flex:1 1 320px; min-width:0}
.live-lead{margin:0; font-size:15.5px; line-height:1.5}
.live-meta{margin:5px 0 0; font-family:var(--mono); font-size:11px;
  letter-spacing:.13em; text-transform:uppercase; color:var(--faint); line-height:1.6}
.live-acts{display:flex; gap:10px; flex-shrink:0; flex-wrap:wrap}


.clock{border:1px solid var(--hair); background:var(--paper-deep);
  padding:15px 20px 16px; margin:0 0 var(--step)}
.clock-in{display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.clock-in .label{font-family:var(--mono); font-size:11px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--dim); flex-shrink:0}
.clock-in input[type=range]{flex:1 1 260px; min-width:180px; accent-color:var(--marigold)}
.clock-in .val{font-family:var(--mono); font-size:13px; color:var(--ink);
  flex-shrink:0; min-width:100px}
.clock .note{margin:9px 0 0; max-width:88ch}

.kpi .v.ahead{color:var(--ocotillo)}
.kpi .v.behind{color:var(--terracotta)}
.kpi .v.level{color:var(--ink)}


.track{display:flex; flex-direction:column; gap:2px}
.track-row{display:grid; grid-template-columns:minmax(150px,1.7fr) minmax(70px,2fr) auto auto;
  align-items:center; gap:14px; padding:9px 0; border-top:1px solid var(--hair-soft)}
.track-row:first-child{border-top:0}
.track-row.muted{opacity:.5}
.track-name{font-size:14.5px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.track-what{display:block; font-family:var(--mono); font-size:10px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--faint)}
.whatif-in input[disabled]{opacity:.45; cursor:not-allowed}
.track-bar{position:relative; height:12px; background:var(--hair-soft); min-width:0}
.track-bar i{position:absolute; top:0; bottom:0; display:block}
.track-bar i.ahead{background:var(--ocotillo)}
.track-bar i.behind{background:var(--terracotta)}
.track-bar b{position:absolute; left:50%; top:-3px; bottom:-3px; width:2px;
  margin-left:-1px; background:var(--marigold); display:block; z-index:1}
.track-n{font-family:var(--mono); font-size:13.5px; text-align:right; min-width:52px}
.track-d{font-family:var(--mono); font-size:12px; text-align:right; min-width:46px}
.track-d.ahead{color:var(--ocotillo)}
.track-d.behind{color:var(--terracotta)}

@media (max-width:640px){
  .livestrip{gap:14px; padding:14px 16px}
  .live-acts{width:100%}
  .live-acts .btn{flex:1 1 0}
  .track-row{grid-template-columns:1fr auto auto; gap:8px 12px}
  .track-bar{grid-column:1 / -1; order:3}
}


#share{position:fixed; inset:0; z-index:80; display:flex; align-items:center; justify-content:center;
  padding:24px; overflow-y:auto}
#share[hidden]{display:none}
#share .s-scrim{position:fixed; inset:0; background:rgba(7,9,12,.74)}
#share .sbox{position:relative; z-index:1; background:var(--paper); border:1px solid var(--hair);
  width:min(640px,100%); margin:auto; display:flex; flex-direction:column; max-height:calc(100vh - 48px)}
#share .s-top{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; padding:22px 26px 0}
#share .s-top h3{font-family:var(--headline); font-size:24px; color:var(--ink)}
#share .s-top p{font-size:14px; color:var(--dim); margin:5px 0 0; line-height:1.5}
#share .s-x{width:34px; height:34px; display:flex; align-items:center; justify-content:center;
  color:var(--faint); flex:none; font-size:21px; line-height:1}
#share .s-x:hover{color:var(--ink)}
#share .s-steps{display:flex; gap:6px; padding:16px 26px 0}
#share .s-steps i{height:2px; flex:1; background:var(--hair)}
#share .s-steps i.on{background:var(--marigold)}
#share .s-body{padding:20px 26px 4px; overflow-y:auto; flex:1; min-height:0}
#share .s-foot{display:flex; align-items:center; justify-content:space-between; gap:14px;
  padding:16px 26px 20px; border-top:1px solid var(--hair); margin-top:18px; flex-wrap:wrap}
#share .s-foot .sum{font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--faint); line-height:1.5; flex:1; min-width:150px}
#share .s-foot .acts{display:flex; gap:10px; flex:none}
#share .s-lbl{font-family:var(--mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--dim); margin:0 0 10px}
#share .s-lbl.mt{margin-top:20px}
#share .opt{display:flex; gap:13px; align-items:flex-start; padding:12px 14px; border:1px solid var(--hair);
  margin-bottom:8px; width:100%; text-align:left; background:var(--paper); transition:border-color .16s,background .16s}
#share .opt:hover{border-color:var(--dim)}
#share .opt.on{border-color:var(--marigold); background:rgba(52,105,97,.06)}
#share .opt[disabled]{opacity:.45; cursor:not-allowed}
#share .box{width:18px; height:18px; border:1px solid rgba(14,17,23,.3); flex:none; margin-top:2px;
  display:flex; align-items:center; justify-content:center; background:var(--paper)}
#share .box.rd{border-radius:50%}
#share .on > .box{background:var(--marigold); border-color:var(--marigold)}
#share .on > .box:after{content:''; width:8px; height:4px; border-left:2px solid var(--paper);
  border-bottom:2px solid var(--paper); transform:rotate(-45deg) translate(1px,-1px)}
#share .on > .box.rd:after{width:6px; height:6px; border:0; border-radius:50%; background:var(--paper); transform:none}
#share .opt .tx{min-width:0; flex:1}
#share .opt .tx b{display:block; font-size:15px; font-weight:500; line-height:1.3}
#share .opt .tx span{display:block; font-size:13px; color:var(--dim); line-height:1.45; margin-top:3px}
#share .opt .rt{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--faint); flex:none; white-space:nowrap; padding-top:3px}
#share .fmts{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
#share .fmts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
#share .fmts .opt{margin-bottom:0; flex-direction:column; gap:8px}
#share .grpgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px}
#share .grpgrid .opt{margin-bottom:0}
#share .psearch,#share .smsg{width:100%; font:inherit; font-size:15px; padding:10px 12px;
  border:1px solid var(--hair); background:#fff; color:var(--ink); border-radius:0}
#share .psearch{margin-bottom:10px}
#share .psearch::placeholder,#share .smsg::placeholder{color:var(--faint)}
#share .smsg{line-height:1.5; resize:vertical; min-height:84px}
#share .plist{max-height:220px; overflow-y:auto; border:1px solid var(--hair)}
#share .pnone{padding:14px; color:var(--dim); font-size:14px}
#share .prow{display:flex; gap:11px; align-items:center; padding:9px 12px; border-bottom:1px solid var(--hair-soft);
  width:100%; text-align:left; background:var(--paper); transition:background .14s}
#share .prow:last-child{border-bottom:0}
#share .prow:hover{background:var(--paper-deep)}
#share .prow .box{margin-top:0}
#share .prow .pav{width:30px; height:30px; background:var(--canyon); color:var(--dim); font-family:var(--mono);
  font-size:10.5px; letter-spacing:.06em; display:flex; align-items:center; justify-content:center; flex:none}
#share .prow.on .pav{background:var(--marigold); color:var(--paper)}
#share .prow .nm{min-width:0; flex:1}
#share .prow .nm b{display:block; font-size:14.5px; font-weight:500; line-height:1.25}
#share .prow .nm span{display:block; font-size:12.5px; color:var(--dim); line-height:1.3; margin-top:1px}
#share .prow .og{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--faint); flex:none; text-align:right}
#share .rchips{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
#share .rchip{display:inline-flex; align-items:center; gap:6px; padding:3px 4px 3px 10px;
  border:1px solid var(--hair); background:var(--canyon); font-size:13px}
#share .rchip button{width:20px; height:20px; display:flex; align-items:center; justify-content:center;
  color:var(--faint); font-size:15px; line-height:1}
#share .rchip button:hover{color:var(--terracotta)}
#share .rev{border:1px solid var(--hair)}
#share .rev .rr{display:flex; justify-content:space-between; gap:16px; padding:11px 14px;
  border-bottom:1px solid var(--hair-soft); font-size:14px}
#share .rev .rr:last-child{border-bottom:0}
#share .rev .rr > span{font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--faint); flex:none; padding-top:2px}
#share .rev .rr > div{text-align:right; min-width:0}
#share .rev .rr b{font-weight:500}
#share .rr-sub{font-size:13px; color:var(--dim)}
#share .snote{margin-top:14px; padding:12px 14px; border-left:2px solid var(--marigold);
  background:var(--canyon); font-size:13.5px; line-height:1.55; color:var(--dim)}
#share .snote b{color:var(--ink); font-weight:500}
#share .done{text-align:center; padding:14px 0 6px}
#share .done .tick{width:56px; height:56px; border:1px solid var(--marigold); color:var(--marigold);
  display:flex; align-items:center; justify-content:center; margin:0 auto 16px}
#share .done h4{font-family:var(--headline); font-weight:400; font-size:24px; margin:0 0 8px}
#share .done p{font-size:14.5px; color:var(--dim); max-width:44ch; margin:0 auto 10px; line-height:1.55}
#share .done .done-fine{font-size:12.5px; color:var(--faint)}
@media (max-width:640px){
  #share{padding:0; align-items:stretch}
  #share .sbox{max-height:none; min-height:100%; border:0}
  #share .s-top,#share .s-steps,#share .s-body,#share .s-foot{padding-left:16px; padding-right:16px}
  #share .fmts,#share .fmts.two,#share .grpgrid{grid-template-columns:1fr}
  #share .fmts .opt{flex-direction:row; gap:13px}
  #share .s-foot{position:sticky; bottom:0; background:var(--paper)}
  #share .prow .og{display:none}
}

<style>
